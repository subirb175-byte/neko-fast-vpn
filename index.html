<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEKO FAST VPN</title>

<style>
body {
  margin: 0;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: #080d18;
  color: white;
  text-align: center;
}

h1 {
  color: #00e5ff;
  margin-top: 35px;
}

.box {
  max-width: 420px;
  margin: 25px auto;
  padding: 22px;
  background: #12213d;
  border: 1px solid #294363;
  border-radius: 20px;
}

input, button {
  width: 100%;
  box-sizing: border-box;
  padding: 15px;
  margin-top: 12px;
  border-radius: 10px;
  font-size: 16px;
}

input {
  background: #080d18;
  color: white;
  border: 1px solid #344966;
}

button {
  background: #00d5ed;
  border: none;
  font-weight: bold;
}

a {
  color: #00e5ff;
}

.status {
  color: #ffca76;
  font-size: 14px;
  line-height: 1.6;
}
</style>
</head>

<body>

<h1>NEKO FAST ⚡</h1>
<p>Your personal browser dashboard</p>

<div class="box">
  <h2>🔒 VPN Dashboard</h2>

  <p class="status" id="status">
    VPN NOT CONNECTED
  </p>

  <p>
    This website cannot create a system-wide VPN connection.
    A compatible VPN service is required.
  </p>

  <a href="https://protonvpn.com/free-vpn"
     target="_blank" rel="noopener noreferrer">
    Explore Free VPN Options
  </a>
</div>

<div class="box">
  <h2>🌐 Browse the Web</h2>

  <form id="searchForm">
    <input id="query"
           placeholder="Search Google or enter a website"
           required>
    <button type="submit">SEARCH ⚡</button>
  </form>
</div>

<div class="box">
  <a href="https://www.google.com">🔍 Google</a>
  <br><br>
  <a href="https://www.youtube.com">▶️ YouTube</a>
  <br><br>
  <a href="https://www.facebook.com">🌐 Facebook</a>
  <br><br>
  <a href="https://www.instagram.com">📸 Instagram</a>
</div>

<script>
document.getElementById("searchForm")
.addEventListener("submit", function(event) {
  event.preventDefault();

  const value = document.getElementById("query")
    .value.trim();

  if (!value) return;

  let destination;

  if (/^https?:\/\//i.test(value)) {
    destination = value;
  } else if (
    /^[a-z0-9-]+(\.[a-z0-9-]+)+(\/.*)?$/i.test(value)
  ) {
    destination = "https://" + value;
  } else {
    destination =
      "https://www.google.com/search?q=" +
      encodeURIComponent(value);
  }

  window.open(destination, "_blank", "noopener");
});
</script>

</body>
</html>
