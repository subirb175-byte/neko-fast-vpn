name: Build Official WireGuard APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Go (for libwg-go)
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Set up NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26c

      - name: Build APK with Gradle
        run: ./gradlew :ui:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wireguard-debug-apk
          path: "ui/build/outputs/apk/debug/*.apk"
          
